<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Gamepad Mouse - 把手柄变成鼠标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021a10"/>
      <stop offset="0.52" stop-color="#064a29"/>
      <stop offset="1" stop-color="#020f0a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ffa3" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#00ffa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8bffc4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4dffab" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="neon" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 手柄图形直接内联在下方，避免 use/currentColor 在不同渲染器下的兼容差异 -->
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="980" cy="60" r="280" fill="url(#halo)"/>
  <circle cx="300" cy="300" r="220" fill="url(#halo)" opacity="0.55"/>
  <path d="M0 300H1200" stroke="#00ffa3" stroke-opacity="0.32" stroke-width="1"/>

  <g transform="translate(72 62) scale(5)" opacity="0.45" filter="url(#soft)">
    <path d="M13.5 11h13c4.4 0 7 3.6 8.2 9.3l1.5 7.2c.5 2.4-1.6 4.5-4 4.5-1.4 0-2.7-.8-3.4-2l-2.3-3.8a2 2 0 0 0-1.7-1H15.2a2 2 0 0 0-1.7 1l-2.3 3.8c-.7 1.2-2 2-3.4 2-2.4 0-4.5-2.1-4-4.5l1.5-7.2C6.5 14.6 9.1 11 13.5 11Z" fill="none" stroke="#00ff9c" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g transform="translate(72 62) scale(5)" filter="url(#neon)">
    <path d="M13.5 11h13c4.4 0 7 3.6 8.2 9.3l1.5 7.2c.5 2.4-1.6 4.5-4 4.5-1.4 0-2.7-.8-3.4-2l-2.3-3.8a2 2 0 0 0-1.7-1H15.2a2 2 0 0 0-1.7 1l-2.3 3.8c-.7 1.2-2 2-3.4 2-2.4 0-4.5-2.1-4-4.5l1.5-7.2C6.5 14.6 9.1 11 13.5 11Z" fill="#00ff9c" fill-opacity="0.08" stroke="#8bffc4" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M12.5 18v6M9.5 21h6" fill="none" stroke="#8bffc4" stroke-width="0.7" stroke-linecap="round"/>
    <g fill="#8bffc4">
      <circle cx="26" cy="19.5" r="0.85"/>
      <circle cx="29.5" cy="23" r="0.85"/>
      <circle cx="22.5" cy="23" r="0.85"/>
      <circle cx="26" cy="26.5" r="0.85"/>
    </g>
  </g>
  <path d="M308 168h96" stroke="#00ffa3" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 7"/>
  <path d="M398 161l10 7-10 7" fill="none" stroke="#00ffa3" stroke-width="1.5"/>

  <text x="428" y="60" font-family="Consolas, Monaco, monospace" font-size="13" letter-spacing="4" fill="#5cffae" opacity="0.8">LOCAL INPUT TOOL  /  WINDOWS 10·11</text>
  <text x="424" y="132" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="1" fill="url(#title)" filter="url(#neon)">GAMEPAD<tspan fill="#00ff9c"> → </tspan>MOUSE</text>
  <text x="428" y="176" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="22" fill="#c8ffe1">把手柄变成鼠标 · 移动 / 左右键 / 滚轮 / 上一步下一步</text>
  <text x="428" y="208" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#69d79c">NS2 Pro 原生直读  ·  Xbox / XInput  ·  SDL2 通用手柄</text>

  <g font-family="Consolas, Monaco, monospace" font-size="12" letter-spacing="1.6">
    <rect x="428" y="238" width="150" height="32" rx="16" fill="#00ff9c" fill-opacity="0.10" stroke="#00ff9c" stroke-opacity="0.55"/>
    <text x="503" y="259" text-anchor="middle" fill="#8bffc4">ZERO DEPENDENCY</text>
    <rect x="590" y="238" width="136" height="32" rx="16" fill="#00ff9c" fill-opacity="0.10" stroke="#00ff9c" stroke-opacity="0.55"/>
    <text x="658" y="259" text-anchor="middle" fill="#8bffc4">GAME AWARE</text>
    <rect x="738" y="238" width="132" height="32" rx="16" fill="#00ff9c" fill-opacity="0.10" stroke="#00ff9c" stroke-opacity="0.55"/>
    <text x="804" y="259" text-anchor="middle" fill="#8bffc4">100% LOCAL</text>
  </g>

  <g transform="translate(1055 205)" filter="url(#neon)">
    <path d="M0 0l0 62 15-15 11 25 9-4-11-25 21-1z" fill="#041a10" stroke="#8bffc4" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="1180" y="300" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="12" letter-spacing="3" fill="#4bd392" opacity="0.75">250 Hz  /  NO CLOUD  /  NO TELEMETRY</text>
</svg>
